<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f3f3">
  <meta name="description" content="Japan Life Base，在日生活讨论社区。交流住房账单、签证手续、工作税务、汽车与日常生活。">
  <title>Japan Life Base · 社区</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到讨论内容</a>
  <header class="topbar">
    <div class="brand-group"><button class="icon-button" id="menu-toggle" aria-label="折叠导航" aria-expanded="true" aria-controls="sidebar" data-icon="menu"></button><a class="brand" href="#" aria-label="Japan Life Base 首页">Japan Life Base</a></div>
    <form class="search" id="search-form" role="search"><span data-icon="search" aria-hidden="true"></span><input id="search-input" aria-label="搜索讨论" placeholder="搜索讨论" autocomplete="off"><button class="icon-button" id="filter-toggle" type="button" aria-label="搜索与显示设置" aria-expanded="false" aria-controls="filter-popover" data-icon="sliders"></button></form>
    <div class="account-actions"><button class="pill" data-auth="register">注册</button><button class="pill" data-auth="login"><span data-icon="user" aria-hidden="true"></span>登录</button></div>
  </header>
  <div class="filter-popover" id="filter-popover" hidden><strong>搜索与显示</strong><label>分类<select id="category-select"><option value="all">所有分类</option></select></label><label class="check"><input id="banner-toggle" type="checkbox" checked>显示首页公告横幅</label><button class="plain-button" id="clear-filters">清除搜索与分类</button></div>
  <div class="drawer-shade" id="drawer-shade" hidden></div>
  <aside class="sidebar" id="sidebar" aria-label="社区导航">
    <div class="sidebar-inner">
      <a class="side-link" href="#about" data-info="about">关于本站</a><a class="side-link" href="#guide" data-info="guide">使用指南</a>
      <button class="side-promo" id="side-promo"><span class="promo-symbol" aria-hidden="true">↗</span><span class="promo-eyebrow">社区共建</span><strong>你的日本生活清单</strong><span class="promo-link">分享经验 <span aria-hidden="true">→</span></span></button>
      <section class="nav-section"><button class="section-toggle" aria-expanded="true" aria-controls="content-links"><span data-icon="chevron-down"></span>内容</button><div id="content-links"><button class="side-link active" data-view="all"><span data-icon="messages"></span>全部讨论</button><button class="side-link" data-info="guides"><span data-icon="book"></span>生活指南</button><button class="side-link" data-filter-shortcut="popular"><span data-icon="flame"></span>热门话题</button><button class="side-link" data-filter-shortcut="unanswered"><span data-icon="message"></span>待回复</button><button class="side-link" data-info="saved"><span data-icon="bookmark"></span>我的收藏</button></div></section>
      <section class="nav-section"><button class="section-toggle" aria-expanded="true" aria-controls="category-links"><span data-icon="chevron-down"></span>分类</button><div id="category-links"></div></section>
      <section class="nav-section"><button class="section-toggle" aria-expanded="true" aria-controls="tool-links"><span data-icon="chevron-down"></span>工具</button><div id="tool-links"><button class="side-link" data-info="denki"><span data-icon="zap"></span>电费比较</button><button class="side-link" data-info="checklist"><span data-icon="check-square"></span>搬家清单</button></div></section>
      <div class="sidebar-footer"><span>简体中文</span><span>Japan Life Base</span></div>
    </div>
  </aside>
  <main id="main" class="main"><div class="content-panel">
    <section id="list-view" aria-label="社区话题">
      <div class="list-toolbar"><nav class="tabs" aria-label="话题排序"><button data-sort="latest" class="tab active" aria-pressed="true">最新</button><button data-sort="popular" class="tab" aria-pressed="false">热门</button></nav><button class="new-topic" id="new-topic"><span data-icon="plus" aria-hidden="true"></span>发帖</button></div>
      <section class="announcement" id="announcement" aria-label="社区公告横幅"><div class="announcement-copy"><span class="banner-category">住房与账单</span><h1>这个月，你家的电费是多少？</h1><p>人数、用电量、账单期间，一起交流。</p><button class="banner-link" id="banner-topic">查看讨论 <span aria-hidden="true">↗</span></button></div><div class="banner-art" aria-hidden="true"><div class="bill-sheet"><span class="bill-head">電気ご使用量</span><strong>300<span> kWh</span></strong><div class="bill-rule"></div><div class="bill-line long"></div><div class="bill-line"></div><span class="bill-stamp">円</span></div><div class="banner-disc"><span data-icon="zap"></span></div><div class="art-grid"></div></div><button class="banner-close icon-button" id="banner-close" aria-label="隐藏公告横幅" data-icon="x"></button><span class="banner-corner">社区话题</span></section>
      <div class="results-context" id="results-context" hidden><span id="results-label"></span><button class="plain-button" id="reset-list">清除筛选</button></div>
      <div class="topic-list" id="topic-list" aria-live="polite"></div>
      <div class="load-more-wrap"><button class="load-more" id="load-more">继续加载 <span data-icon="chevron-down" aria-hidden="true"></span></button><span class="end-note" id="end-note" hidden>已显示全部话题</span></div>
      <footer class="panel-footer"><span>Japan Life Base</span><span>界面演示 · 话题与互动数据均为示例</span></footer>
    </section>
    <section id="detail-view" hidden aria-label="话题详情"><button class="back-button" id="back-to-list"><span data-icon="arrow-left"></span>返回讨论</button><div id="topic-detail"></div></section>
  </div></main>
  <button class="assistant-launcher" id="assistant-launcher" aria-expanded="false" aria-controls="assistant-panel"><span data-icon="messages" aria-hidden="true"></span><span>AI 生活助手</span></button>
  <section class="assistant-panel" id="assistant-panel" hidden aria-label="AI 生活助手"><header><div><strong>AI 生活助手</strong><span>交互演示</span></div><button class="icon-button" id="assistant-close" aria-label="关闭生活助手" data-icon="x"></button></header><div class="chat-messages" id="chat-messages" aria-live="polite"><div class="chat-bubble">你可以搜索社区里的讨论。试试“电费”“租房”或“搬家”。</div></div><form id="chat-form"><input id="chat-input" aria-label="向生活助手提问" placeholder="输入你的问题…" maxlength="200"><button class="icon-button" aria-label="发送问题" data-icon="arrow-up"></button></form><p class="chat-note">本页未接入 AI，使用示例回复。</p></section>
  <dialog id="site-dialog"><div class="dialog-header"><h2 id="dialog-title"></h2><button class="icon-button" id="dialog-close" aria-label="关闭窗口" data-icon="x"></button></div><div id="dialog-body"></div></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
