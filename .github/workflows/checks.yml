name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check maintained dictionaries
        run: node ops/check-i18n.mjs
      - name: Run isolated application tests
        run: node --test tests/*.test.mjs
      - name: Check release installer
        run: python3 -B tests/installer_test.py
